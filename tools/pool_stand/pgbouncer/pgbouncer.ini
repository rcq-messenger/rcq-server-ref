; The local pool stand (tools/pool_stand/README.md). Local only: the password
; here and in userlist.txt is a throwaway for a container on 127.0.0.1.
;
; Mirrors DigitalOcean's managed pool as far as it is known: TRANSACTION mode,
; 15 backends for the app database, ~120 s query_wait_timeout (inferred from the
; ConnectionDoesNotExistError 121 s after the triggers on 26.09 and 27.09).
[databases]
rcq = host=rcqstand-pg port=5432 dbname=rcq user=rcq password=rcqpw pool_size=15

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 15
max_client_conn = 1000
query_wait_timeout = 120
ignore_startup_parameters = extra_float_digits,options
admin_users = rcq
stats_users = rcq
log_connections = 0
log_disconnections = 0
