# Single-host self-hosting compose stack.
#
# Bring up:        docker compose up -d --build
# Tail logs:       docker compose logs -f app
# Shell in app:    docker compose exec app bash
# Bring down:      docker compose down
#
# Prerequisites before `docker compose up`:
#   1. Copy `.env.example` to `.env` and fill in:
#        - JWT_SECRET   (e.g. `openssl rand -hex 32`)
#        - RCQ_DOMAIN   (the hostname iOS clients will connect to)
#        - POSTGRES_PASSWORD (optional, falls back to "rcq")
#      iOS clients require HTTPS (App Transport Security), so RCQ_DOMAIN
#      must be a real hostname with a public A-record pointing at this
#      host. Caddy auto-issues a Let's Encrypt cert on first boot.
#      No domain, or no certificate authority that will issue to you: run
#      install.sh (it asks), or set RCQ_TLS_MODE=fingerprint + RCQ_CADDYFILE
#      by hand. docs/tls-without-a-ca.md.
#   2. (Optional) Drop an APNs `.p8` key at `./apns.p8` next to this file
#      if you want iOS push notifications. See `docs/apns.md`. Without
#      the file the server runs fine — users get messages on the next
#      WebSocket reconnect, just without iOS alert pushes.
#
# What you get:
#   - caddy on :80 + :443, auto-TLS for RCQ_DOMAIN (or the island's own
#     pinned certificate from ./certs in fingerprint mode)
#   - app (FastAPI) on the internal docker network at app:8000
#   - postgres 16 with a persistent volume
#   - redis 7 with a persistent volume (AOF on)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    ports:
      - "80:80"
      - "443:443"
      # Caddy listens on UDP 443 too in default configs (HTTP/3). We've
      # disabled h3 in Caddyfile.compose so the UDP port is harmless if
      # not mapped, but exposing it costs nothing.
      - "443:443/udp"
    environment:
      RCQ_DOMAIN: ${RCQ_DOMAIN}
    volumes:
      # Which Caddyfile: Let's Encrypt by default; the fingerprint one when
      # install.sh ran without a domain (RCQ_CADDYFILE in .env); a masquerade
      # one the same way. docs/tls-without-a-ca.md.
      - ${RCQ_CADDYFILE:-./deploy/Caddyfile.compose}:/etc/caddy/Caddyfile:ro
      # The island's own certificate, fingerprint mode. Mounted in every mode
      # so switching is a .env edit and a restart; in CA mode the directory
      # is empty (certs/.gitkeep keeps it in the checkout so the mount works).
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    # The app's access log is identity-free (uvicorn masks the account number
    # and the address), but without a cap docker keeps every line forever:
    # bounded so the disk is not a history of when the island was busy.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL + REDIS_URL so the app talks to the
      # service hostnames rather than localhost.
      DATABASE_URL: "postgresql+asyncpg://rcq:${POSTGRES_PASSWORD:-rcq}@postgres:5432/rcq"
      REDIS_URL: "redis://redis:6379/0"
    # No `ports:` mapping — app is reachable only through Caddy from the
    # outside. Inside the docker network it's `app:8000`.
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - news_media:/app/news_media
      - evidence:/app/evidence
      # `.rcq` site bundles. Public bytes, unlike everything else here, and
      # the only content on the island the operator can read - which is why
      # they live in a volume of their own rather than beside the media.
      - sites:/app/sites
      # APNs push notifications (optional). Drop your Apple `.p8` key at
      # ./apns.p8 next to docker-compose.yml and uncomment the mount
      # below, then set APNS_KEY_PATH=/keys/apns.p8 plus APNS_KEY_ID +
      # APNS_TEAM_ID + APNS_BUNDLE_ID in .env. See docs/apns.md for the
      # full walkthrough. Leave the mount commented out and the key
      # fields empty in .env to disable push entirely.
      # - ./apns.p8:/keys/apns.p8:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rcq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcq}
      POSTGRES_DB: rcq
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # TURN relay for WebRTC calls behind symmetric NAT / CGNAT. Without it, calls
  # fall back to STUN-only: the UI "connects" (on the SDP answer) but no media
  # ever flows for peers on hard NATs (common on mobile carriers). OPT-IN — it
  # only starts with `docker compose --profile turn up -d`, so the default stack
  # is unchanged. Requires TURN_HOST + TURN_SECRET in .env (the same secret the
  # app signs credentials with). Uses host networking because coturn needs the
  # host's real public IP and a wide UDP relay-port range, which Docker's NAT
  # can't bridge efficiently. Open the firewall for 3478/tcp+udp and
  # 49152-65535/udp (and 5349 if you enable TLS below).
  #
  # TURN-over-TLS is the path that survives DPI/UDP-blocking (e.g. RU). To enable
  # it, mount a cert whose SAN covers TURN_HOST, uncomment the tls flags below,
  # and set TURN_TLS_PORT in .env. Caddy already owns 443 on this host, so use
  # 5349 here (or run coturn on a separate box to claim 443). See docs/bare-metal.md.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    profiles: ["turn"]
    network_mode: host
    command:
      - "-n"
      - "--realm=${TURN_HOST}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--no-cli"
      - "--no-loopback-peers"
      - "--no-multicast-peers"
      - "--fingerprint"
      # coturn auto-detects the public IP on most cloud hosts. If your box only
      # sees a private IP on its NIC (true 1:1 NAT), set TURN_EXTERNAL_IP in .env
      # to the public IP and uncomment the next line.
      # - "--external-ip=${TURN_EXTERNAL_IP}"
      # TURN-over-TLS (set TURN_TLS_PORT=5349 in .env + mount the cert below):
      # - "--tls-listening-port=5349"
      # - "--cert=/certs/turn.crt"
      # - "--pkey=/certs/turn.key"
    # volumes:
    #   - ./certs:/certs:ro

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  media:
  news_media:
  evidence:
  sites:
